<!DOCTYPE html>
<!-- 채용 과제 프론트엔드 플레이스홀더 — Swagger UI로 API를 탐색할 수 있습니다 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Class API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 2rem 3rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      text-align: center;
    }
    h1 { margin: 0 0 1rem; font-size: 1.6rem; color: #111; }
    p  { margin: 0; color: #555; line-height: 1.6; }
    a  { color: #0066cc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Live Class API</h1>
    <p>
      백엔드 API 문서는
      <a href="http://localhost:8080/swagger-ui.html">Swagger UI</a>
      에서 확인하세요.
    </p>
  </div>
</body>
</html>
