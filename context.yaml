    summary: ARCHITECTURE.md
    detail_ko: https://github.com/corinB/live-class/wiki/ko-architecture-detail
    audience: [ai-en, human-ko]
    role: concurrency control, caching, scheduling decisions
  - id: doc/docs
    summary: DOCS.md
    detail_ko: https://github.com/corinB/live-class/wiki/ko-docs-detail
    audience: [ai-en, human-ko]
    role: DDD domain design (bounded contexts, aggregates, events)
  - id: doc/contributing
    summary: CONTRIBUTING.md
    detail_ko: https://github.com/corinB/live-class/wiki/ko-contributing-detail
    audience: [ai-en, human-ko]
    role: branch, commit, PR conventions for multi-agent workflow
  - id: doc/orchestration
    summary: ORCHESTRATION.md
    detail_ko: https://github.com/corinB/live-class/wiki/ko-orchestration-detail
    audience: [ai-en, human-ko]
    role: multi-agent pipeline policy (stages, deliverables, blocking rules)

project_identity:
  id: project/live_class
  name: "live-class"
  description: >
    Live class enrollment system.
    A Creator opens a class and sets capacity, price, and period;
    a Classmate applies, pays, and cancels. The core business rules
    are the capacity ceiling, a 7-day cancellation window after payment,
    and automatic FIFO waitlist promotion.
  version: "0.0.1-SNAPSHOT"
  repository: "https://github.com/corinB/live-class.git"
  hiring_assignment_deadline: "2026-05-16 23:59 KST"
  main_tech_stack:
    - language: "Java 21"
    - framework: "Spring Boot 4.0.6"
    - build: "Gradle Groovy DSL"
    - database: "PostgreSQL 16"
    - cache_and_lock: "Redis 7 (Lettuce + Spring Data Redis + Lua atomic scripts; Redisson removed by Pre-flight 4 decision)"
    - api_docs: "springdoc-openapi 2.8.5 (Swagger UI)"
    - container: "Docker Compose (4 profiles - db, redis, back, front)"
    - registry: "Docker Hub"
    - deploy: "AWS EC2 single instance (docker compose runtime)"
    - ci_cd: "GitHub Actions (build-test -> push-image -> deploy-ec2)"
    - code_review_ai: "Gemini API (gemini-2.5-pro) via GitHub Actions on PR open/sync"

business_context:
  domains:
    - id: domain/class
      name: "Class"
      description: "Class creation, state lifecycle, capacity management"
      core_entities: ["Class", "ClassStatus"]
      states:
        - {id: state/class/draft, value: DRAFT}
        - {id: state/class/open, value: OPEN}
        - {id: state/class/closed, value: CLOSED}
      invariants:
        - id: invariant/class/enrollment_only_when_open
          text: "Enrollment is only accepted while the class is OPEN."
        - id: invariant/class/one_way_state
          text: "State transitions are one-way (no reverse)."
        - id: invariant/class/creator_only_transition
          text: "Only the Creator can transition state (Quartz autoClose is a system call that bypasses this)."
        - id: invariant/class/auto_close_on_period_end
          text: "When period.endDate passes, Quartz ClassAutoCloseJob auto-closes the class (daily 00:05 KST). A Creator manual close races with auto-close and is resolved by @Version optimistic lock."
    - id: domain/enrollment
      name: "Enrollment"
      description: "Apply, payment, cancellation, waitlist. AFTER_COMMIT side-effect hooks (notification / metrics / external queue) flow through EnrollmentEventListener (4 listeners — onCreated / onConfirmed / onCancelled / onWaitlistPromoted, stub today)."
      core_entities: ["Enrollment", "EnrollmentStatus"]
      states:
        - {id: state/enrollment/pending, value: PENDING}
        - {id: state/enrollment/confirmed, value: CONFIRMED}
        - {id: state/enrollment/cancelled, value: CANCELLED}
        - {id: state/enrollment/waitlisted, value: WAITLISTED}
      invariants:
        - id: invariant/enrollment/no_overcapacity_pending
          text: "Over-capacity applications never enter PENDING (only WAITLISTED or rejected)."
        - id: invariant/enrollment/cancellation_window
          text: "Cancellation is forbidden 7 days after CONFIRMED."
        - id: invariant/enrollment/fifo_promotion
          text: "WAITLISTED promotion is FIFO by appliedAt."
    - id: domain/user
      name: "User"
      description: "User identity and role"
      core_entities: ["User", "UserRole"]
      roles: ["Creator", "Classmate"]
      auth_mechanism: "Mock - identified by the X-User-Id header. Spring Security is not used."
      authorization: "Role check happens in the web layer (controller-level role assertion against UserRole resolved from X-User-Id). Each api/* entry's `caller:` field declares the required role."

  glossary:
    # state/enrollment/* and state/class/* nodes carry value-level definitions (no duplicate term/* entries for PENDING/CONFIRMED/CANCELLED/WAITLISTED/DRAFT/OPEN/CLOSED).
    - {id: term/creator, term: "Creator", definition: "Instructor role that opens a class."}
    - {id: term/classmate, term: "Classmate", definition: "Student role that applies for a class."}
    - {id: term/last_seat_race, term: "Last-seat race", definition: "Race condition where multiple users simultaneously apply for the last seat of Class.capacity."}
    - {id: term/cancellation_window, term: "Cancellation window", definition: "The 7-day window after payment (CONFIRMED) during which cancellation is allowed."}
    - {id: term/waitlist_promotion, term: "Waitlist promotion", definition: "When a CONFIRMED enrollment cancels, the oldest WAITLISTED entry is automatically promoted to PENDING."}
    - {id: term/zset_mirror, term: "ZSET mirror", definition: "Two Redis Sorted Sets (enrolled:{classId}, waitlist:{classId}) mirror the active Enrollment set with score=appliedAtNanos. Enrollment Aggregate index + first gate for race-critical decisions."}
    - {id: term/lua_atomic_script, term: "Lua atomic script", definition: "Script that executes read-modify-write atomically inside the Redis single-threaded server. Three scripts: enrollment_apply / enrollment_cancel_promote / enrollment_compensate."}
    - {id: term/reconcile, term: "Reconcile", definition: "Rebuilds the Redis ZSET from the DB at boot. Runtime force-trigger via POST /api/admin/reconcile/{classId}."}
    - {id: term/auto_close, term: "Auto-close", definition: "Quartz ClassAutoCloseJob runs daily at 00:05 KST and transitions OPEN classes whose endDate has passed to CLOSED."}

  scripts:
    - id: script/lua/enrollment_apply
      path: "live-class/src/main/resources/lua/enrollment_apply.lua"
      purpose: "Atomic ZCARD(enrolled) vs capacity check, then ZADD into enrolled or waitlist based on outcome."
    - id: script/lua/enrollment_cancel_promote
      path: "live-class/src/main/resources/lua/enrollment_cancel_promote.lua"
      purpose: "Atomic ZREM(enrolled) + ZPOPMIN(waitlist) + ZADD(enrolled) on cancellation."
    - id: script/lua/enrollment_compensate
      path: "live-class/src/main/resources/lua/enrollment_compensate.lua"
      purpose: "Rolls back the ZSET ZADD when the matching DB INSERT/UPDATE fails."

  mirrors:
    - {id: mirror/redis/zset_enrolled, key: "enrolled:{classId}", purpose: "Active Enrollment index (PENDING + CONFIRMED). score = appliedAtNanos."}
    - {id: mirror/redis/zset_waitlist, key: "waitlist:{classId}", purpose: "FIFO waitlist for over-capacity applications. score = appliedAtNanos."}
    - {id: mirror/redis/class_status, key: "class:status:{classId}", purpose: "Hot path Class state mirror used by enrollment_apply.lua to gate non-OPEN applications."}

engineering_principles:
  - id: principle/coding_standards
    items:
      - "Domain logic lives inside domain entities. The service layer is orchestration only."
      - "State transitions are expressed as methods on the domain entity; invariant violations throw domain exceptions."
      - "Prefer Java records or final classes with immutable fields."
      - "Lombok is allowed (@Getter, @RequiredArgsConstructor). Avoid @Data."
      - "Every new source file starts with a one-line Korean header comment (CLAUDE.md rule 6)."
      - "Korean prose must not end with a colon (CLAUDE.md rule 5)."
  - id: principle/error_handling
    items:
      - "GlobalExceptionHandler handles common response mapping."
      - "Domain exceptions extend RuntimeException and are mapped to ProblemDetail."
      - "No external calls (mock payment). Lua EVALSHA falls back to EVAL on cache miss. On Redis failure return 503 fail-closed (consistency first)."
  - id: principle/testing
    items:
      - "Unit tests verify domain entity state transitions with plain JUnit."
      - "Integration tests use @SpringBootTest + Testcontainers (PostgreSQL + Redis)."
      - "Concurrency tests simulate N-thread races with ExecutorService and require 10 consecutive successful runs."

context_map:
  directories:
    - {id: dir/domain, path: "live-class/src/main/java/com/example/liveclass/domain", contains: "Domain model - Class, Enrollment, User aggregates"}
    - {id: dir/web, path: "live-class/src/main/java/com/example/liveclass/web", contains: "REST controllers, DTOs, exception handlers"}
    - {id: dir/config, path: "live-class/src/main/java/com/example/liveclass/config", contains: "Spring Boot configuration (OpenAPI, Redis, Lua RedisScript, Cache, WebMvc, Quartz)"}
    - {id: dir/resources, path: "live-class/src/main/resources", contains: "application.yaml - per-profile config. Secrets via env vars."}
    - {id: dir/test, path: "live-class/src/test/java", contains: "Unit, integration, and concurrency tests"}
    - {id: dir/plan_after, path: "wiki-src/plan-after", contains: "Completed task files (moved by worker)"}
    - {id: dir/reports, path: "reports", contains: "End-of-run reports per agent (reports/{NN_step}_{agent}_{YYYY-MM-DD}.md)"}
    - {id: dir/reports_refactoring, path: "reports/refactoring", contains: "/evolution cycle outputs — refactoring-maestro summary + per-domain worker scan reports"}
    - {id: dir/reports_load_test, path: "reports/load-test", contains: "Isolated load-test result reports (e.g. t3-small / t3-nano limit findings)"}
    - {id: dir/scripts_load_test, path: "scripts/load-test", contains: "Python E2E load-test harness (open-run.py + README, used against docker-compose.t3-*.yml)"}
    - {id: dir/claude_agents, path: ".claude/agents", contains: "Subagents (catalog at .claude/context/agents.yaml)"}
    - {id: dir/claude_skills, path: ".claude/skills", contains: "Slash skills (catalog at .claude/context/skills.yaml)"}
    - {id: dir/claude_templates, path: ".claude/templates", contains: "Deliverable templates (DOCS, ARCH, plan, report, CONTRIBUTING, PR, compose, Dockerfile, ci-cd)"}

  apis:
    - {id: api/class/create, endpoint: "POST /api/classes", caller: "Creator", summary: "creates a DRAFT Class"}
    - {id: api/class/transition_open, endpoint: "PATCH /api/classes/{id}/status OPEN", caller: "Creator", summary: "starts accepting applications. @Version optimistic lock + 1-retry on OL conflict. Refreshes class:status:{id} mirror."}
    - {id: api/enrollment/apply, endpoint: "POST /api/enrollments", caller: "Classmate", summary: "ClassLockService.executeWithLock(classId) outer-wrap (Redis SET NX PX, 30s TTL, safe-unlock by token) -> enrollment_apply.lua atomic ZCARD vs capacity -> DB INSERT (PENDING/WAITLISTED). DB failure -> enrollment_compensate.lua rolls back. Lock busy -> ClassLockBusyException -> 503 (errorCode CLASS_LOCK_BUSY)."}
    - {id: api/enrollment/confirm_payment, endpoint: "POST /api/enrollments/{id}/confirm-payment", caller: "Classmate (mock)", summary: "@Version optimistic lock PENDING -> CONFIRMED with 1-retry on OL conflict. ZSET unchanged."}
    - {id: api/enrollment/cancel, endpoint: "DELETE /api/enrollments/{id}", caller: "Classmate", summary: "ClassLockService.executeWithLock(classId) outer-wrap -> Enrollment.cancel(now) domain method enforces the 7-day window (CONFIRMED branch) and idempotent CANCELLED handling -> DB UPDATE -> enrollment_cancel_promote.lua ZREM+ZPOPMIN+ZADD -> promoted WAITLISTED -> PENDING. Promoted DB UPDATE failure triggers compensation Lua reversing the ZSET swap (covered by EnrollmentCancelCompensationTest)."}
    - {id: api/class/students, endpoint: "GET /api/classes/{id}/students", caller: "Creator only", summary: "paginated list of CONFIRMED Enrollments"}
    - {id: api/admin/reconcile, endpoint: "POST /api/admin/reconcile/{classId}", caller: "ops", summary: "ClassLockService.tryRun(classId) guard (returns false on contention, skipping) -> DEL the ZSET and rebuild enrolled/waitlist from the DB. Shares the lock key with apply/cancel so a concurrent enrollment forces reconcile to skip."}
    - {id: api/scheduled/auto_close, endpoint: "[Scheduled] ClassAutoCloseJob daily at 00:05 KST", caller: "Quartz", summary: "calls autoClose() on OPEN classes whose endDate has passed"}

  external_dependencies:
    - {id: external/docker_hub, service: "Docker Hub", purpose: "Container image registry (qor7777777/live-class-back)."}
    - {id: external/aws_ec2, service: "AWS EC2", purpose: "Runtime host (Ubuntu 22.04 + docker compose)"}
    - {id: external/gemini_api, service: "Gemini API", purpose: "Automated PR code review (gemini-2.5-flash, advisory)"}
    - {id: external/quartz, service: "Quartz Scheduler", purpose: "In-memory JobStore, Asia/Seoul tz. OPEN -> CLOSED on endDate. Switch to JDBC JobStore when scaling."}

constraints_and_rules:
  strictly_prohibited:
    - {id: policy/no_spring_in_domain, text: "No Spring annotations in the domain layer (@Service etc. belong to application layer)."}
    - {id: policy/no_hardcoded_secrets, text: "No hard-coded passwords, API keys, or DB URLs. env vars -> .env or GitHub Secrets."}
    - {id: policy/no_overcapacity_path, text: "No code path that lets an over-capacity application enter PENDING (only WAITLISTED or rejection)."}
    - {id: policy/no_springboot_for_unit, text: "Do not use @SpringBootTest for domain unit tests (plain JUnit only)."}
    - {id: policy/no_destructive_git, text: "git push --force and git reset --hard are forbidden (pre-bash hook blocks them)."}
    - {id: policy/no_spring_security, text: "Do not introduce Spring Security (mock auth is enough; out of scope)."}
    - {id: policy/no_real_payment, text: "No real PG/card integration (mock payment with state transitions only)."}
    - {id: policy/no_external_calls_in_compensation_window, text: "No external calls between a Redis ZSET update and the matching DB INSERT/UPDATE (compensation window minimal)."}
    - {id: policy/no_select_for_update_on_race, text: "Do not use PG SELECT FOR UPDATE on the race-critical path (Lua atomic scripts only). @Version optimistic lock reserved for 7-day window and state transitions."}
  performance_requirements:
    - {id: policy/api_p95_200ms, text: "API p95 latency under 200ms (local)."}
    - {id: policy/race_test_deterministic, text: "100% deterministic outcome on the last-seat race test (10 consecutive runs)."}
    - {id: policy/lua_p99_5ms, text: "Lua call p99 < 5ms (single Redis roundtrip, EVALSHA cache hit baseline)."}
  language_policy:
    - {id: policy/lang_korean_user_facing, text: "User-facing replies in Korean. Technical artifacts (commit messages, design docs, code comments) in English."}
    - {id: policy/lang_korean_docs_kept, text: "Korean-language artifacts (DOCS.md, ARCHITECTURE.md, README.md, etc.) keep their Korean body."}

