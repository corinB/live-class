# 영문 요약 + 한국어 Wiki 링크 + Hybrid 그래프(노드 id + relationships 트리플) 인덱스. 카탈로그/자동화/그래프는 imports 참조.
schema_version: 3

schema_notes:
  - "Each entity carries an `id`. Cross-cutting relations live in .claude/context/graph.yaml as {from, to, type} triples."
  - "id naming: `<type>/<slug>` where type in {domain, state, script, mirror, api, agent, skill, workflow, dir, external, invariant, term, principle, policy, doc, project, automation}."
  - "Closed `type` vocabulary: contains, transitions_to, enforced_by, mitigated_by, writes, reads, mirrors, scopes, triggered_by, owns, chains, depends_on, ref."
  - "Audit: `python .claude/scripts/audit-context-yaml.py` walks imports + validates graph integrity (exit 0 = no drift)."

imports:
  # Audit walks these and merges nodes/relationships for integrity checks.
  - ".claude/context/agents.yaml"     # agents_catalog
  - ".claude/context/skills.yaml"     # skills_catalog
  - ".claude/context/automation.yaml" # automation_pipeline
  - ".claude/context/graph.yaml"      # relationships triples

docs:
  - id: doc/claude
    summary: CLAUDE.md
    detail_ko: null
    audience: [ai-en, human-ko]
    role: project conventions auto-loaded by Claude Code at session start
