project_identity:
  name: "live-class"
  description: >
    Live class enrollment system.
    A Creator opens a class and sets capacity, price, and period;
    a Classmate applies, pays, and cancels. The core business rules
    are the capacity ceiling, a 7-day cancellation window after payment,
    and automatic FIFO waitlist promotion.
  version: "0.0.1-SNAPSHOT"
  repository: "https://github.com/corinB/live-class.git"
  hiring_assignment_deadline: "2026-05-16 23:59 KST"
  main_tech_stack:
    - language: "Java 21"
    - framework: "Spring Boot 4.0.6"
    - build: "Gradle Groovy DSL"
    - database: "PostgreSQL 16"
    - cache_and_lock: "Redis 7 (Lettuce client + Spring Data Redis + Lua atomic scripts; Redisson was removed by Pre-flight 4 decision)"
    - api_docs: "springdoc-openapi 2.8.5 (Swagger UI)"
    - container: "Docker Compose (4 profiles ??db, redis, back, front)"
    - registry: "Docker Hub"
    - deploy: "AWS EC2 single instance (docker compose runtime)"
    - ci_cd: "GitHub Actions (build-test -> push-image -> deploy-ec2)"
    - code_review_ai: "Gemini API (gemini-2.5-pro) via GitHub Actions on PR open/sync"

business_context:
  domains:
    - name: "Class"
      description: "Class creation, state lifecycle, capacity management"
      core_entities: ["Class", "ClassStatus"]
      states: ["DRAFT", "OPEN", "CLOSED"]
      invariants:
        - "Enrollment is only accepted while the class is OPEN."
        - "State transitions are one-way (no reverse)."
        - "Only the Creator can transition state (Quartz autoClose is a system call that bypasses this)."
        - "When period.endDate passes, Quartz ClassAutoCloseJob auto-closes the class (daily 00:05 KST, Asia/Seoul). A Creator manual close races with auto-close and is resolved by @Version optimistic lock."
    - name: "Enrollment"
      description: "Apply, payment, cancellation, waitlist"
      core_entities: ["Enrollment", "EnrollmentStatus"]
      states: ["PENDING", "CONFIRMED", "CANCELLED", "WAITLISTED"]
      invariants:
        - "Over-capacity applications never enter PENDING (only WAITLISTED or rejected)."
        - "Cancellation is forbidden 7 days after CONFIRMED."
        - "WAITLISTED promotion is FIFO by appliedAt."
    - name: "User"
      description: "User identity and role"
      core_entities: ["User", "UserRole"]
      roles: ["Creator", "Classmate"]
      auth_mechanism: "Mock ??identified by the X-User-Id header. Spring Security is not used."

  glossary:
    - term: "Creator"
      definition: "The instructor role that opens a class."
    - term: "Classmate"
      definition: "The student role that applies for a class."
    - term: "PENDING"
      definition: "Application complete, awaiting payment."
    - term: "CONFIRMED"
      definition: "Payment complete, enrollment fixed."
    - term: "CANCELLED"
      definition: "Cancelled."
    - term: "WAITLISTED"
      definition: "Entered the waitlist due to over-capacity. When a seat opens, FIFO promotion to PENDING."
    - term: "Last-seat race"
      definition: "A race condition where multiple users simultaneously apply for the last seat of Class.capacity."
    - term: "Cancellation window"
      definition: "The 7-day window after payment (CONFIRMED) during which cancellation is allowed."
    - term: "Waitlist promotion"
      definition: "When a CONFIRMED enrollment cancels, the oldest WAITLISTED entry is automatically promoted to PENDING."
    - term: "ZSET mirror"
      definition: "Two Redis Sorted Sets (enrolled:{classId}, waitlist:{classId}) mirror the active Enrollment set with score=appliedAtNanos. They act as the Enrollment Aggregate index and the first gate for race-critical decisions."
    - term: "Lua atomic script"
      definition: "A script that executes read-modify-write atomically inside the Redis single-threaded server. Three scripts are in use: enrollment_apply / enrollment_cancel_promote / enrollment_compensate. No distributed lock needed."
    - term: "Reconcile"
      definition: "Rebuilds the Redis ZSET from the DB at boot (DB -> Redis), assuming possible drift. At runtime it is force-triggered via POST /api/admin/reconcile/{classId}."
    - term: "Auto-close"
      definition: "Quartz ClassAutoCloseJob runs daily at 00:05 KST and transitions OPEN classes whose endDate has passed to CLOSED."

engineering_principles:
  coding_standards:
    - "Domain logic lives inside domain entities. The service layer is orchestration only."
    - "State transitions are expressed as methods on the domain entity; invariant violations throw domain exceptions."
    - "Prefer Java records or final classes with immutable fields."
    - "Lombok is allowed (@Getter, @RequiredArgsConstructor). Avoid @Data."
    - "Every new source file starts with a one-line Korean header comment (CLAUDE.md rule 6)."
    - "Korean prose must not end with a colon (CLAUDE.md rule 5)."
  error_handling:
    - pattern: "GlobalExceptionHandler handles common response mapping."
    - domain_exception_base: "Domain exceptions extend RuntimeException and are mapped to ProblemDetail."
    - retry_policy: "No external calls (mock payment). Lua EVALSHA falls back to EVAL on cache miss (handled by Lettuce). On Redis failure, immediately return 503 fail-closed (consistency first)."
  testing:
    - "Unit tests verify domain entity state transitions with plain JUnit."
    - "Integration tests use @SpringBootTest + Testcontainers (PostgreSQL + Redis)."
    - "Concurrency tests simulate N-thread races with ExecutorService and require 10 consecutive successful runs."

context_map:
  directories:
    - path: "live-class/src/main/java/com/example/liveclass/domain"
      contains: "Domain model ??Class, Enrollment, User aggregates"
    - path: "live-class/src/main/java/com/example/liveclass/web"
      contains: "REST controllers, DTOs, exception handlers"
    - path: "live-class/src/main/java/com/example/liveclass/config"
      contains: "Spring Boot configuration (OpenAPI, Redis, Lua RedisScript, Cache, WebMvc, Quartz)"
    - path: "live-class/src/main/resources"
      contains: "application.yaml ??per-profile config. Secrets are injected via env vars."
    - path: "live-class/src/test/java"
      contains: "Unit, integration, and concurrency tests"
    - path: "plan/before"
      contains: "Micro-task specs emitted by scrum-task-decomposer or maestro"
    - path: "plan/after"
      contains: "Completed task files, moved by the worker in the same PR"
    - path: "reports"
      contains: "End-of-run reports per agent. Format: reports/{NN_step}_{agent-name}_{YYYY-MM-DD}.md"
    - path: ".claude/agents"
      contains: "Eight subagents (ddd-domain-architect, concurrency-architect, scrum-task-decomposer, infra-cicd-operator, git-master-conventions, blueprint-executor-worker, maestro, worker)"
    - path: ".claude/skills"
      contains: "Six slash commands (agent wrappers)"
    - path: ".claude/templates"
      contains: "Deliverable templates ??DOCS, ARCH, plan, report, CONTRIBUTING, PR, docker-compose, Dockerfile, ci-cd"

  request_flow:
    - "POST /api/classes (Creator) -> creates a DRAFT Class"
    - "PATCH /api/classes/{id}/status OPEN (Creator) -> starts accepting applications. Refreshes the Redis class:status:{id} mirror"
    - "POST /api/enrollments (Classmate) -> calls enrollment_apply.lua (atomic ZCARD enrolled vs capacity branch) -> DB INSERT depending on the result (PENDING/WAITLISTED). On DB failure, enrollment_compensate.lua rolls back the ZSET"
    - "POST /api/enrollments/{id}/confirm-payment (mock) -> @Version optimistic lock transitions PENDING -> CONFIRMED. ZSET is unchanged (enrolled contains both PENDING and CONFIRMED)"
    - "DELETE /api/enrollments/{id} (Classmate) -> validates the 7-day window -> DB UPDATE CANCELLED -> enrollment_cancel_promote.lua atomically ZREM enrolled + ZPOPMIN waitlist + ZADD enrolled -> the promoted Enrollment is updated to PENDING in DB"
    - "GET /api/classes/{id}/students (Creator only) -> paginated list of CONFIRMED Enrollments"
    - "POST /api/admin/reconcile/{classId} (ops) -> DEL the ZSET and rebuild enrolled/waitlist from the DB"
    - "[Scheduled] ClassAutoCloseJob daily at 00:05 KST -> calls autoClose() on OPEN classes whose endDate has passed"

  external_dependencies:
    - service: "Docker Hub"
      purpose: "Container image registry. Public repo qor7777777/live-class-back."
    - service: "AWS EC2"
      purpose: "Runtime host (Ubuntu 22.04 + docker compose)"
    - service: "Google AI Studio (Gemini API)"
      purpose: "Automated PR code review (gemini-2.5-flash, advisory)"
    - service: "Quartz Scheduler (in-memory JobStore, Asia/Seoul timezone)"
      purpose: "Class auto-close ??transitions OPEN -> CLOSED when endDate passes. Assumes a single EC2 host; switch to a JDBC JobStore when scaling to multiple instances."

constraints_and_rules:
  strictly_prohibited:
    - "No Spring annotations in the domain layer (@Service etc. belong to the application layer)."
    - "No hard-coded passwords, API keys, or DB URLs. Everything goes through env vars -> .env or GitHub Secrets."
    - "No code path that lets an over-capacity application enter PENDING (only WAITLISTED or rejection)."
    - "Do not use @SpringBootTest for domain unit tests (use plain JUnit)."
    - "git push --force and git reset --hard are forbidden (a pre-bash hook blocks them)."
    - "Do not introduce Spring Security (mock auth is enough; out of scope)."
    - "No real PG/card integration (mock payment with state transitions only)."
    - "No external calls between a Redis ZSET update and the matching DB INSERT/UPDATE (keep the compensation window minimal)."
    - "Do not use PG SELECT FOR UPDATE on the race-critical path (Lua atomic scripts are the only mechanism). @Version optimistic lock is reserved for the 7-day window and state transitions."
  performance_requirements:
    - "API p95 latency under 200ms (local)."
    - "100% deterministic outcome on the last-seat race test (10 consecutive runs)."
    - "Lua call p99 < 5ms (single Redis roundtrip, EVALSHA cache hit baseline)."
  language_policy:
    - "User-facing replies are in Korean. Technical artifacts (commit messages, design docs, code comments) are in English."
    - "Korean-language artifacts (DOCS.md, ARCHITECTURE.md, README.md, etc.) keep their Korean body."

automation_pipeline:
  description: "Issue-driven local-led automation. The user authors one GitHub Issue; the main Claude Code session runs Maestro then Worker(s) on demand. GitHub Actions handles notification + auto-rebase + gatekeeping only."
  trigger:
    issue_label: "maestro:auto"
    auto_applied_by_template: ".github/ISSUE_TEMPLATE/automation-feature.yml"
  agents:
    - name: "maestro"
      path: ".claude/agents/maestro.md"
      role: "Decompose the Issue into plan/before/NN_*.md + manifest.json. Never writes code."
    - name: "worker"
      path: ".claude/agents/worker.md"
      role: "Implement one plan/before/NN_*.md inside an isolated worktree and open one PR labeled automation:worker."
  workflows:
    - name: "maestro-dispatch.yml"
      purpose: "Notify the user (Issue comment + needs-maestro label) that the local Maestro should run. No LLM call."
    - name: "gatekeeper.yml"
      purpose: "Auto-merge automation:worker PRs when CI is green AND Gemini reports P0=0, P1=0."
    - name: "auto-rebase.yml"
      purpose: "Rebase open automation:worker PRs when main advances."
  gatekeeper_conditions:
    - "Build & Test check_suite conclusion success"
    - "Latest Gemini review comment shows P0 == 0 AND P1 == 0"
  labels:
    - "maestro:auto"
    - "automation:worker"
    - "needs-maestro"
    - "needs-human"
  kill_switch:
    repository_variable: "AUTOMATION_ENABLED"
    values: ["true", "false"]
  cost_cap:
    per_issue_token_budget: 200000
  guides:
    - "docs/guides/automation-usage.md"
    - "docs/guides/automation-hitl.md"
    - "docs/guides/automation-troubleshooting.md"
  architecture_docs:
    - "docs/architecture/automation-pipeline.md"
    - "docs/architecture/automation-pipeline-workflows.md"

