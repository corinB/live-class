# live-class Hiring Assignment — Context Configuration
# 생성일: 2026-05-11
# 용도: LLM 컨텍스트 주입 및 RAG 가이드용. 모든 에이전트/스킬/문서는 이 파일을 우선 스캔한다.

project_identity:
  name: "live-class"
  description: >
    라이브 강의 수강신청 시스템.
    Creator가 강의를 개설하고 정원·가격·기간을 설정하며, Classmate가 신청·결제·취소한다.
    정원 제한, 결제 후 7일 취소 창, 대기열 자동 승격이 핵심 비즈니스 규칙이다.
  version: "0.0.1-SNAPSHOT"
  repository: "https://github.com/corinB/live-class.git"
  hiring_assignment_deadline: "2026-05-16 23:59 KST"
  main_tech_stack:
    - language: "Java 21"
    - framework: "Spring Boot 4.0.6"
    - build: "Gradle Groovy DSL"
    - database: "PostgreSQL 16"
    - cache_and_lock: "Redis 7 (Lettuce client + Spring Data Redis + Lua atomic scripts; Redisson은 Pre-flight 4 결정으로 제거)"
    - api_docs: "springdoc-openapi 2.8.5 (Swagger UI)"
    - container: "Docker Compose (4 profiles — db, redis, back, front)"
    - registry: "Docker Hub"
    - deploy: "AWS EC2 single instance (docker compose runtime)"
    - ci_cd: "GitHub Actions (build-test → push-image → deploy-ec2)"
    - code_review_ai: "Gemini API (gemini-2.5-flash) via GitHub Actions on PR open/sync"

business_context:
  domains:
    - name: "Class"
      description: "강의 개설 및 상태 라이프사이클, 정원 관리"
      core_entities: ["Class", "ClassStatus"]
      states: ["DRAFT", "OPEN", "CLOSED"]
      invariants:
        - "OPEN 상태에서만 수강 신청을 수용한다"
        - "상태 전이는 일방향이다 (역방향 금지)"
        - "Creator만 상태 전이를 수행할 수 있다 (단 Quartz autoClose는 시스템 호출로 우회)"
        - "period.endDate 경과 시 Quartz ClassAutoCloseJob이 자동 close (매일 00:05 KST, Asia/Seoul). Creator 수동 close와 @Version optimistic lock으로 충돌 해소"
    - name: "Enrollment"
      description: "수강 신청·결제·취소·대기열"
      core_entities: ["Enrollment", "EnrollmentStatus"]
      states: ["PENDING", "CONFIRMED", "CANCELLED", "WAITLISTED"]
      invariants:
        - "정원 초과 신청은 PENDING으로 들어갈 수 없다 (WAITLISTED 또는 거부만 가능)"
        - "CONFIRMED 후 7일이 지나면 취소 불가"
        - "WAITLISTED 승격은 FIFO 순서 (appliedAt 기준)"
    - name: "User"
      description: "사용자 식별 및 역할"
      core_entities: ["User", "UserRole"]
      roles: ["Creator", "Classmate"]
      auth_mechanism: "Mock — 헤더 X-User-Id로 식별. Spring Security 미사용."

  glossary:
    - term: "Creator"
      definition: "강의를 개설하는 강사 역할"
    - term: "Classmate"
      definition: "강의를 신청하는 수강생 역할"
    - term: "PENDING"
      definition: "신청 완료, 결제 대기 상태"
    - term: "CONFIRMED"
      definition: "결제 완료, 수강 확정 상태"
    - term: "CANCELLED"
      definition: "취소된 상태"
    - term: "WAITLISTED"
      definition: "정원 초과로 대기열에 진입한 상태. 자리가 비면 FIFO로 PENDING 승격"
    - term: "Last-seat race"
      definition: "Class.capacity의 마지막 자리를 두고 여러 사용자가 동시 신청하는 race condition"
    - term: "Cancellation window"
      definition: "결제 완료(CONFIRMED) 시점부터 7일 이내의 취소 가능 기간"
    - term: "Waitlist promotion"
      definition: "CONFIRMED 취소로 자리가 비면 WAITLISTED 중 가장 오래된 한 건이 PENDING으로 자동 승격되는 절차"
    - term: "ZSET mirror"
      definition: "Redis Sorted Set 두 개(enrolled:{classId}, waitlist:{classId})로 활성 Enrollment 집합을 미러링. score=appliedAtNanos. Enrollment Aggregate의 index 역할이며 race-critical 결정의 1차 게이트"
    - term: "Lua atomic script"
      definition: "Redis 서버 단일 스레드 안에서 read-modify-write를 원자 실행하는 스크립트. enrollment_apply / enrollment_cancel_promote / enrollment_compensate 세 가지를 사용. 분산 락 불필요"
    - term: "Reconcile"
      definition: "Redis ZSET이 DB와 어긋날 가능성을 가정하고 부팅 시 DB → Redis로 ZSET을 재구성하는 절차. 운영 중에는 POST /api/admin/reconcile/{classId}로 강제 트리거"
    - term: "Auto-close"
      definition: "Quartz ClassAutoCloseJob이 매일 00:05 KST에 endDate 경과한 OPEN Class를 CLOSED로 자동 전이시키는 동작"

engineering_principles:
  coding_standards:
    - "도메인 로직은 도메인 엔티티 내에 캡슐화한다. 서비스 레이어는 오케스트레이션만 담당한다."
    - "상태 전이는 도메인 엔티티의 메서드로 표현하고, 불변식 위반 시 도메인 예외를 던진다."
    - "Java record 또는 final class + immutable 필드를 우선한다."
    - "Lombok 사용 가능. @Getter, @RequiredArgsConstructor 등은 허용. @Data는 피한다."
    - "모든 새 소스 파일 첫 줄에 한국어 1줄 헤더 주석을 둔다 (CLAUDE.md §6)."
    - "한국어 문장은 콜론으로 종결하지 않는다 (CLAUDE.md §5)."
  error_handling:
    - pattern: "GlobalExceptionHandler를 통한 공통 응답 처리"
    - domain_exception_base: "도메인 예외는 RuntimeException 상속, ProblemDetail로 매핑"
    - retry_policy: "외부 호출 없음 (mock payment). Lua 스크립트 EVALSHA 캐시 미스 시 EVAL fallback (Lettuce 자동). Redis 호출 실패 시 즉시 503 fail-closed (정합성 우선)."
  testing:
    - "단위 테스트는 도메인 엔티티의 상태 전이를 순수 JUnit으로 검증한다."
    - "통합 테스트는 @SpringBootTest + Testcontainers (PostgreSQL + Redis)."
    - "동시성 테스트는 ExecutorService로 N 스레드 race를 시뮬레이션한다. 10회 연속 통과를 요구한다."

context_map:
  directories:
    - path: "live-class/src/main/java/com/example/liveclass/domain"
      contains: "도메인 모델 — Class, Enrollment, User aggregate"
    - path: "live-class/src/main/java/com/example/liveclass/web"
      contains: "REST 컨트롤러, DTO, 예외 핸들러"
    - path: "live-class/src/main/java/com/example/liveclass/config"
      contains: "Spring Boot 설정 (OpenAPI, Redis, Lua RedisScript, Cache, WebMvc, Quartz)"
    - path: "live-class/src/main/resources"
      contains: "application.yaml — 환경별 설정. 시크릿은 환경변수 주입."
    - path: "live-class/src/test/java"
      contains: "단위·통합·동시성 테스트"
    - path: "plan/before"
      contains: "scrum-task-decomposer가 생성한 마이크로 태스크 명세"
    - path: "plan/after"
      contains: "blueprint-executor-worker가 완료한 태스크"
    - path: "reports"
      contains: "각 에이전트의 작업 종료 보고서. 형식: reports/{NN_step}_{agent-name}_{YYYY-MM-DD}.md"
    - path: ".claude/agents"
      contains: "6개 서브에이전트 정의 (ddd-domain-architect, concurrency-architect, scrum-task-decomposer, infra-cicd-operator, git-master-conventions, blueprint-executor-worker)"
    - path: ".claude/skills"
      contains: "6개 슬래시 커맨드 (에이전트 wrapper)"
    - path: ".claude/templates"
      contains: "산출물 템플릿 — DOCS·ARCH·plan·report·CONTRIBUTING·PR·docker-compose·Dockerfile·ci-cd"

  request_flow:
    - "POST /api/classes (Creator) → Class DRAFT 생성"
    - "PATCH /api/classes/{id}/status OPEN (Creator) → 신청 수용 시작. Redis class:status:{id} mirror 갱신"
    - "POST /api/enrollments (Classmate) → enrollment_apply.lua 호출 (ZCARD enrolled vs capacity 원자 분기) → 결과(PENDING/WAITLISTED)에 따라 DB INSERT. DB 실패 시 enrollment_compensate.lua로 ZSET 되돌림"
    - "POST /api/enrollments/{id}/confirm-payment (mock) → @Version optimistic lock으로 PENDING → CONFIRMED. ZSET 갱신 없음 (enrolled에 PENDING과 CONFIRMED 둘 다 포함)"
    - "DELETE /api/enrollments/{id} (Classmate) → 7일 창 검증 → DB UPDATE CANCELLED → enrollment_cancel_promote.lua가 ZREM enrolled + ZPOPMIN waitlist + ZADD enrolled 원자 swap → promoted Enrollment DB UPDATE PENDING"
    - "GET /api/classes/{id}/students (Creator-only) → CONFIRMED Enrollment paginated 목록"
    - "POST /api/admin/reconcile/{classId} (운영용) → DEL ZSET 후 DB에서 enrolled/waitlist 재구성"
    - "[Scheduled] ClassAutoCloseJob 매일 00:05 KST → endDate 경과한 OPEN Class에 autoClose() 호출"

  external_dependencies:
    - service: "Docker Hub"
      purpose: "컨테이너 이미지 레지스트리. 공개 리포 qor7777777/live-class-back."
    - service: "AWS EC2"
      purpose: "런타임 호스트 (Ubuntu 22.04 + docker compose)"
    - service: "Google AI Studio (Gemini API)"
      purpose: "PR 자동 코드 리뷰 (gemini-2.5-flash, 참고용)"
    - service: "Quartz Scheduler (in-memory JobStore, Asia/Seoul timezone)"
      purpose: "Class auto-close — endDate 경과 시 OPEN → CLOSED 자동 전이. 단일 EC2 가정. 멀티 인스턴스 확장 시 JDBC JobStore 전환."

constraints_and_rules:
  strictly_prohibited:
    - "도메인 레이어에서 Spring 어노테이션 사용 금지 (@Service 등은 application 레이어로)"
    - "하드코딩된 패스워드·API Key·DB URL 금지. 모두 환경변수 → .env 또는 GitHub Secrets로."
    - "정원 초과 신청을 PENDING으로 들어가게 하는 코드 금지 (WAITLISTED 또는 거부만 허용)"
    - "@SpringBootTest를 도메인 단위 테스트에 사용 금지 (순수 JUnit으로 검증)"
    - "git push --force, git reset --hard 금지 (pre-bash hook이 차단)"
    - "Spring Security 도입 금지 (mock 인증으로 충분, 범위 외)"
    - "Real PG/카드 결제 연동 금지 (mock 단순 상태 변경)"
    - "Redis ZSET 갱신과 DB INSERT/UPDATE 사이에 외부 호출 금지 (보상 윈도우 최소화)"
    - "race-critical path에서 PG SELECT FOR UPDATE 사용 금지 (Lua atomic script로 일원화). @Version optimistic lock은 7일 창과 상태 전이에 한정"
  performance_requirements:
    - "API 응답 p95 200ms 이내 (로컬 기준)"
    - "마지막 자리 race 테스트에서 100% 결정론적 결과 (10회 연속 통과)"
    - "Lua 호출 p99 < 5ms (단일 Redis 라운드트립, EVALSHA 캐시 히트 기준)"
  language_policy:
    - "사용자 응답은 한국어. 기술 산출물(커밋 메시지, 설계 문서, 코드 주석)은 영어."
    - "단, 한국어 산출물(DOCS.md, ARCHITECTURE.md, README.md 등)은 한국어 본문 유지."

