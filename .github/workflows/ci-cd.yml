# live-class CI/CD — build-test → push-image → deploy-ec2
# Triggers: push to main (full pipeline) | pull_request to main (build-test only)

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'plan/**'
      - 'reports/**'
      - '.claude/**'
      - '.gitignore'
      - '.claudeignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'plan/**'
      - 'reports/**'
      - '.claude/**'
      - '.gitignore'
      - '.claudeignore'
      - '.gitattributes'
      - 'LICENSE'

jobs:

  # ── 1. Build & Test ────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Cancel an in-flight Build & Test on the same branch when a new push arrives.
    # Scoped to this job only — push-image and deploy-ec2 below must NOT be cancellable.
    concurrency:
      group: ci-build-test-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # gradle/actions/setup-gradle@v4 (2026 Q1) reworked the cache-key algorithm.
      # The 512-char key collision pattern that caused HTTP 400 on every restore
      # (visible as 'Failed to restore gradle-home-v1' annotation on every PR
      # since the workflow was added) is fixed in v4.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Drop --no-daemon (irrelevant on ephemeral runners) and clean (discards
      # compiled output that --build-cache could reuse). Enable build cache and
      # disable filesystem watching (pointless on one-shot CI invocations).
      - name: Run tests
        working-directory: live-class
        run: ./gradlew test --build-cache --no-watch-fs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: live-class/build/reports/tests/

  # ── 2. Build & Push Docker Images ─────────────────────────────────────────
  push-image:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./live-class
          file: ./live-class/Dockerfile
          push: true
          tags: |
            qor7777777/live-class-back:latest
            qor7777777/live-class-back:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: |
            qor7777777/live-class-front:latest
            qor7777777/live-class-front:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Deploy to EC2 ───────────────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.yml,front/index.html"
          target:   "/home/ubuntu/live-class/"
          overwrite: true

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/live-class
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull
            docker compose --profile db --profile redis --profile back --profile front up -d
            docker image prune -f
            sleep 15
            RUNNING=$(docker compose --profile db --profile redis --profile back --profile front ps --status running --format '{{.Name}}' | wc -l)
            EXPECTED=4
            echo "Running containers: $RUNNING / $EXPECTED"
            docker compose --profile db --profile redis --profile back --profile front ps
            if [ "$RUNNING" -lt "$EXPECTED" ]; then
              echo "::error::Expected $EXPECTED containers running, found $RUNNING"
              docker compose --profile db --profile redis --profile back --profile front logs --tail=50
              exit 1
            fi
