# wiki URL 활성 여부 및 내부 cross-link 정합성을 PR마다 검사하는 link-checker 워크플로우
name: Link Checker

on:
  pull_request:
    paths:
      - 'context.yaml'
      - 'CLAUDE.md'
      - 'ARCHITECTURE.md'
      - 'DOCS.md'
      - 'CONTRIBUTING.md'
      - 'ORCHESTRATION.md'
      - 'wiki-src/**'
      - '.github/workflows/link-checker.yml'
  workflow_dispatch:

concurrency:
  group: link-checker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: |
            --config .lychee.toml
            --verbose
            --no-progress
            context.yaml
            CLAUDE.md
            ARCHITECTURE.md
            DOCS.md
            CONTRIBUTING.md
            ORCHESTRATION.md
            wiki-src/**/*.md
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}