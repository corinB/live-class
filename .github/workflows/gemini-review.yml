# PR 자동 코드 리뷰 — Google Gemini API (gemini-2.5-pro) 호출 후 결과를 PR 댓글로 게시
name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # NOTE: paths-ignore intentionally removed so the workflow runs on every PR.
    # Required status checks must always produce a result; path filters caused
    # PRs whose changes were entirely under e.g. `.claude/**` to leave the
    # `gemini-review` context permanently expected, blocking merge. The
    # equivalent filter is reproduced inside the job via an explicit step that
    # exits with success when no relevant changes are present.

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout PR head (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute path-filter decision
        id: filter
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "$BASE_REF...HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed files detected; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Reproduce the previous paths-ignore filter inline.
          # A file is "ignored" if it matches any of these patterns:
          #   **/*.md, plan/**, reports/**, .gitignore,
          #   .claudeignore, .gitattributes, LICENSE
          # NOTE: .claude/** was previously ignored but now triggers a review —
          # hook/agent changes deserve scrutiny too, and an empty-diff filter
          # below (RAW_DIFF) prevents noise when those are the only changes.
          IGNORE_REGEX='(\.md$|^plan/|^reports/|^\.gitignore$|^\.claudeignore$|^\.gitattributes$|^LICENSE$)'
          SHOULD_RUN=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if echo "$f" | grep -qE "$IGNORE_REGEX"; then
              continue
            fi
            SHOULD_RUN=true
            break
          done <<< "$CHANGED"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Changed files (truncated):"
          echo "$CHANGED" | head -30

      - name: Compute PR diff (truncated to fit gemini-2.5-pro context)
        id: diff
        if: steps.filter.outputs.should_run == 'true'
        env:
          # 2.5-pro의 1M token 입력 컨텍스트(약 4M chars) 안에서 시스템 프롬프트·PR 메타데이터·여유 마진을 빼고 안전하게 잡은 cutoff. 기존 50000자로는 한 PR이 보통 누적되면 잘렸음.
          CUTOFF_CHARS: "800000"
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.event.pull_request.base.ref }}"
          # 자기참조(gemini-review.yml)만 제외. `.github/**` 통째 제외는 workflow
          # 변경 PR(예: PR #90)이 빈 diff 를 받아 'PR 누락' P0 false-positive 를 유발했음.
          RAW_DIFF=$(git diff "$BASE_REF...HEAD" -- ':(exclude).github/workflows/gemini-review.yml' ':(exclude)plan/**' ':(exclude)reports/**' || true)
          # 이전 구현은 `printf '%s' "$RAW_DIFF" | wc -c` 였으나, `set -o pipefail` + 큰 RAW_DIFF 조합에서 printf 가 SIGPIPE 를 받아 워크플로 자체가 실패하는 케이스가 PR #1 에서 발견됨. bash 내장 `${#var}` 로 pipe 없이 길이 측정해 우회.
          TOTAL_CHARS=${#RAW_DIFF}
          if [ "$TOTAL_CHARS" -gt "$CUTOFF_CHARS" ]; then
            # bash native substring expansion 으로 head -c 의 SIGPIPE 위험도 회피.
            DIFF=${RAW_DIFF:0:$CUTOFF_CHARS}
            TRUNCATED=true
          else
            DIFF="$RAW_DIFF"
            TRUNCATED=false
          fi
          # DIFF 본문을 GITHUB_OUTPUT 으로 보내면 다음 스텝이 env 로 받게 되고 800KB 가
          # Linux ARG_MAX(~128KB) 를 초과해 bash spawn 단계에서 'Argument list too long'
          # 으로 실패한다. 파일로 떨어뜨려 outputs 에는 경로만 전달.
          DIFF_FILE="$RUNNER_TEMP/pr_diff.txt"
          printf '%s' "$DIFF" > "$DIFF_FILE"
          echo "diff_file=$DIFF_FILE" >> "$GITHUB_OUTPUT"
          echo "truncated=$TRUNCATED" >> "$GITHUB_OUTPUT"
          echo "total_chars=$TOTAL_CHARS" >> "$GITHUB_OUTPUT"
          echo "cutoff_chars=$CUTOFF_CHARS" >> "$GITHUB_OUTPUT"

      - name: Call Gemini API
        id: gemini
        if: steps.filter.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DIFF_FILE: ${{ steps.diff.outputs.diff_file }}
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
        run: |
          set -euo pipefail

          SYSTEM_PROMPT=$(cat <<'EOF'
          당신은 Spring Boot 4 + Java 21 백엔드 코드 리뷰 전문가입니다. live-class(라이브 강의 수강신청) 도메인의 PR을 한국어로 리뷰합니다.

          다음 4개 관점에서 우선 검토하세요.

          1. 정확성 — 상태 전이 무결성(DRAFT→OPEN→CLOSED, PENDING→CONFIRMED→CANCELLED), 도메인 invariant 위반 여부.
          2. 동시성 — 마지막 자리 race, 7일 취소창, 대기열 FIFO 승격에서의 lock 누락이나 double-promotion 가능성.
          3. 보안 — X-User-Id mock 인증 외 다른 인증 경로 누락, SQL injection, 시크릿 하드코딩.
          4. 테스트 커버리지 — 상태 전이·동시성·경계 케이스에 대한 테스트 누락.

          출력 형식.
          - `## 요약`: 2-3줄 한 줄 평
          - `## 발견사항`: 우선순위(P0/P1/P2)별 bullet. 각 항목에 파일경로:줄번호 인용.
          - `## 추천 후속작업`: 머지 전에 처리해야 할 것 + 후속 PR로 미뤄도 될 것 구분

          잠재적 거짓양성은 명시("확신 낮음, 컨텍스트 부족"). 칭찬은 짧게.
          EOF
          )

          # 800k 자 cutoff에서 REQUEST_BODY를 -d 인자로 직접 넘기면 OS ARG_MAX (Linux 보통 ~128KB)에
          # 막혀 `/usr/bin/curl: Argument list too long`이 발생한다. 임시 파일에 바디를 쓰고
          # --data-binary @file 로 전달해 인자 길이 제약을 회피한다.
          # DIFF 본문도 jq --rawfile 로 직접 읽어 env-var 경로의 ARG_MAX 제약을 피한다.
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          jq -n \
            --arg sys "$SYSTEM_PROMPT" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg truncated "$TRUNCATED" \
            --rawfile diff "$DIFF_FILE" \
            '{
              system_instruction: { parts: [{ text: $sys }] },
              contents: [{ role: "user", parts: [{ text: "PR Title: \($title)\n\nPR Description:\n\($body)\n\nDiff (truncated=\($truncated)):\n```diff\n\($diff)\n```" }] }],
              generationConfig: { temperature: 0.2, maxOutputTokens: 8192 }
            }' > "$BODY_FILE"

          RESPONSE=$(curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary "@$BODY_FILE" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=$GEMINI_API_KEY")

          # 파싱 실패 시 진단 정보를 함께 게시한다. .candidates[0].content.parts[0].text 가 없으면 다음 후보들에서 단서 추출.
          REVIEW_BODY=$(printf '%s' "$RESPONSE" | jq -r '
            if (.candidates[0].content.parts[0].text // "") != "" then
              .candidates[0].content.parts[0].text
            elif (.error.message // "") != "" then
              "Gemini API error: " + .error.message
            elif (.candidates[0].finishReason // "") != "" then
              "Gemini finishReason=" + (.candidates[0].finishReason | tostring)
              + (if .promptFeedback.blockReason then " · blockReason=" + (.promptFeedback.blockReason | tostring) else "" end)
              + " — 모델이 본문 없이 종료. promptFeedback/usageMetadata는 Actions 로그에서 확인 가능."
            else
              "Gemini 응답 파싱 실패. 원본 응답: " + (. | tostring | .[0:500])
            end
          ')

          {
            echo 'review<<__REVIEW_EOF__'
            printf '%s\n' "$REVIEW_BODY"
            echo '__REVIEW_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Post review as PR comment
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.gemini.outputs.review }}
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
          TOTAL_CHARS: ${{ steps.diff.outputs.total_chars }}
          CUTOFF_CHARS: ${{ steps.diff.outputs.cutoff_chars }}
        with:
          script: |
            const review = process.env.REVIEW || '_리뷰 본문 없음._';
            const truncated = process.env.TRUNCATED === 'true';
            const totalChars = process.env.TOTAL_CHARS;
            const cutoffChars = process.env.CUTOFF_CHARS || '800000';
            const truncNote = truncated
              ? `\n\n> ⚠️ Diff가 ${totalChars}자라서 처음 ${Number(cutoffChars).toLocaleString()}자만 모델에 전달되었습니다. 누락된 부분은 사람이 확인해 주세요.`
              : '';
            const body = `🤖 **Gemini AI 자동 리뷰 (참고용)**\n\n${review}${truncNote}\n\n---\n_이 리뷰는 \`gemini-2.5-pro\` 모델이 자동 생성한 결과입니다. 머지 결정은 사람이 합니다._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Emit skipped notice when no relevant changes
        if: steps.filter.outputs.should_run != 'true'
        run: |
          echo "[gemini-review] skipped — all changed files match paths-ignore patterns."
          echo "This job emits success so the required status check is satisfied."
