# Automation pipeline: notifies that a maestro:auto Issue is awaiting local Claude Code processing
# After realign: GitHub Actions does NOT invoke Claude. The main Claude Code session runs Maestro on demand.
name: Maestro Dispatch (notify)

on:
  issues:
    types: [opened, labeled]

jobs:
  notify:
    name: Tag and Notify
    runs-on: ubuntu-latest
    if: |
      vars.AUTOMATION_ENABLED == 'true' &&
      contains(github.event.issue.labels.*.name, 'maestro:auto')
    permissions:
      issues: write

    steps:
      - name: Kill-switch check
        run: echo "AUTOMATION_ENABLED=${{ vars.AUTOMATION_ENABLED }}"

      - name: Add needs-maestro label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "needs-maestro"

      - name: Post acknowledgement comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "이 Issue 는 \`maestro:auto\` 라벨이 붙어 있어 자동화 파이프라인 대상입니다.

          현재 파이프라인은 **메인 Claude Code 세션이 직접 Maestro/Worker 를 호출**하는 구조입니다. GitHub Actions 는 알림 · gatekeeper · auto-rebase 만 담당합니다.

          진행하려면 로컬 Claude Code 세션에 \`Issue #${{ github.event.issue.number }} 처리해\` 라고 지시하세요. Maestro 가 \`plan/before/\` 를 만들고 Worker 들이 PR 을 엽니다.

          상세 흐름은 \`docs/guides/automation-usage.md\` 참고."
