name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'wiki-src/**'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Clone wiki repo
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/corinB/live-class.wiki.git" \
            wiki-clone

      - name: Mirror wiki-src/ into wiki clone
        run: |
          rsync -a --delete wiki-src/ wiki-clone/

      - name: Commit and push to wiki
        working-directory: wiki-clone
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "chore(wiki): sync from wiki-src @ ${{ github.sha }}"
            git push
          fi
