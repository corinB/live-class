# Automation pipeline: routes @claude comments from authorized users to Maestro or Worker
name: Comment Handler

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  handle-comment:
    name: Route @claude Comment
    runs-on: ubuntu-latest
    # Guard: AUTOMATION_ENABLED, comment contains @claude (case-insensitive), authorized author
    if: |
      vars.AUTOMATION_ENABLED == 'true' &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Kill-switch check
        run: echo "AUTOMATION_ENABLED=${{ vars.AUTOMATION_ENABLED }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code SDK
        run: npm install -g @anthropic-ai/claude-code

      - name: Parse intent and route
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine if this is an issue comment or PR review comment
          if [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            COMMENT_TYPE="pr_review"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ -n "${{ github.event.issue.pull_request.url }}" ]; then
            COMMENT_TYPE="pr_comment"
            PR_NUMBER="${{ github.event.issue.number }}"
          else
            COMMENT_TYPE="issue_comment"
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi

          echo "comment_type=$COMMENT_TYPE" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER:-}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER:-}" >> "$GITHUB_OUTPUT"

          # Extract the instruction text (everything after @claude)
          BODY="${{ github.event.comment.body }}"
          INSTRUCTION=$(echo "$BODY" | sed -n 's/.*@claude[[:space:]]*/\1/p' | head -1)
          echo "instruction=$INSTRUCTION" >> "$GITHUB_OUTPUT"

          # Determine if issue is maestro-managed (has label maestro:auto)
          if [ "$COMMENT_TYPE" = "issue_comment" ]; then
            IS_MAESTRO=$(gh issue view "${ISSUE_NUMBER}" --json labels \
              --jq '[.labels[].name] | contains(["maestro:auto"]) | tostring')
            echo "is_maestro=$IS_MAESTRO" >> "$GITHUB_OUTPUT"
          fi

      # ── Branch: PR comment → re-dispatch Worker ────────────────────────
      - name: Re-dispatch Worker for PR comment
        if: |
          steps.route.outputs.comment_type == 'pr_comment' ||
          steps.route.outputs.comment_type == 'pr_review'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.route.outputs.pr_number }}
          EXTRA_INSTRUCTION: ${{ steps.route.outputs.instruction }}
        run: |
          node - <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');

          const agentPath = '.claude/agents/worker.md';
          const prNumber = process.env.PR_NUMBER;
          const extraInstruction = process.env.EXTRA_INSTRUCTION;

          // Fetch PR details to find TASK_FILE and branch
          const prInfo = JSON.parse(
            execSync(
              `gh pr view ${prNumber} --json headRefName,labels,title`,
              { encoding: 'utf8' }
            )
          );
          const branch = prInfo.headRefName;

          // Find the task file from plan/before/ matching this branch slug
          const { readdirSync } = require('fs');
          let taskFile = '';
          try {
            const files = readdirSync('plan/before').filter(f => f.endsWith('.md'));
            // Derive NN from branch name (feature/task-NN-slug → NN)
            const nnMatch = branch.match(/task-(\d{2})-/);
            if (nnMatch) {
              const nn = nnMatch[1];
              taskFile = files.find(f => f.startsWith(nn + '_')) || '';
              if (taskFile) taskFile = 'plan/before/' + taskFile;
            }
          } catch {}

          if (!taskFile) {
            console.error('Could not resolve TASK_FILE from branch:', branch);
            process.exit(1);
          }

          // Checkout the PR branch and create a worktree
          execSync(`git fetch origin ${branch}`, { stdio: 'inherit' });

          const worktreePath = `/tmp/retry-worker-${Date.now()}`;
          execSync(`git worktree add ${worktreePath} ${branch}`, { stdio: 'inherit' });

          const prompt = `You are running as the Worker subagent for a HITL retry.
          TASK_FILE=${taskFile}
          WORKTREE_PATH=${worktreePath}
          BASE_BRANCH=main
          EXTRA_INSTRUCTION=${extraInstruction}
          Read ${agentPath} for full instructions.
          Apply EXTRA_INSTRUCTION on top of the original task.
          Push a new commit to the existing branch. Do not open a new PR.`;

          try {
            execSync(
              `claude --agent-file ${agentPath} -p "${prompt.replace(/"/g, '\\"')}"`,
              {
                stdio: 'inherit',
                env: { ...process.env },
                cwd: worktreePath,
              }
            );
            // Remove needs-human label if present
            execSync(
              `gh pr edit ${prNumber} --remove-label "needs-human" 2>/dev/null || true`,
              { stdio: 'inherit' }
            );
          } catch (err) {
            console.error('Worker retry failed:', err.message);
            process.exit(1);
          } finally {
            execSync(`git worktree remove --force ${worktreePath} || true`, { stdio: 'inherit' });
          }
          EOF

      # ── Branch: Issue comment on maestro-managed issue → re-plan ──────
      - name: Re-run Maestro for Issue comment
        if: |
          steps.route.outputs.comment_type == 'issue_comment' &&
          steps.route.outputs.is_maestro == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.route.outputs.issue_number }}
          EXTRA_INSTRUCTION: ${{ steps.route.outputs.instruction }}
        run: |
          node - <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');

          const agentPath = '.claude/agents/maestro.md';
          const issueNumber = process.env.ISSUE_NUMBER;

          const issueJson = execSync(
            `gh issue view ${issueNumber} --json title,body,labels,number`,
            { encoding: 'utf8' }
          );

          const prompt = `You are running as the Maestro subagent for a HITL re-plan.
          ISSUE_JSON=${issueJson.trim()}
          EXTRA_INSTRUCTION=${process.env.EXTRA_INSTRUCTION}
          Re-plan: update or replace existing plan/before/NN_*.md files and manifest.json.
          Apply EXTRA_INSTRUCTION as an additional constraint.
          Commit with message: chore(maestro): re-plan issue #${issueNumber}
          Footer: Refs: #${issueNumber}`;

          try {
            execSync(
              `claude --agent-file ${agentPath} -p "${prompt.replace(/"/g, '\\"')}"`,
              {
                stdio: 'inherit',
                env: { ...process.env },
              }
            );
          } catch (err) {
            console.error('Maestro re-plan failed:', err.message);
            process.exit(1);
          }
          EOF

      - name: React to comment with eyes emoji
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content="eyes" 2>/dev/null || true
