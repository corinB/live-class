# main 푸시 시 Docker 이미지 빌드/푸시 후 EC2 배포를 수행하는 CD 워크플로
name: CD

on:
  push:
    branches: [main]
    paths:
      - 'live-class/**'
      - 'front/**'
      - 'docker-compose.yml'

jobs:

  # ── 1. Build & Push Docker Images ─────────────────────────────────────────
  push-image:
    name: Push Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./live-class
          file: ./live-class/Dockerfile
          push: true
          tags: |
            qor7777777/live-class-back:latest
            qor7777777/live-class-back:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: |
            qor7777777/live-class-front:latest
            qor7777777/live-class-front:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 2. Deploy to EC2 ───────────────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.yml,front/index.html"
          target:   "/home/ubuntu/live-class/"
          overwrite: true

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/live-class
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull
            docker compose --profile db --profile redis --profile back --profile front up -d
            docker image prune -f
            sleep 15
            RUNNING=$(docker compose --profile db --profile redis --profile back --profile front ps --status running --format '{{.Name}}' | wc -l)
            EXPECTED=4
            echo "Running containers: $RUNNING / $EXPECTED"
            docker compose --profile db --profile redis --profile back --profile front ps
            if [ "$RUNNING" -lt "$EXPECTED" ]; then
              echo "::error::Expected $EXPECTED containers running, found $RUNNING"
              docker compose --profile db --profile redis --profile back --profile front logs --tail=50
              exit 1
            fi
